# The only production stack to start after migration. It deliberately does not
# define MinIO, Meilisearch, ClamAV, OpenWA, or the Prometheus/Grafana stack.
# `name: chabaqa` retains the existing chabaqa_mongo-data Docker volume.
name: chabaqa

services:
  mongo:
    image: mongo:7
    container_name: chabaqa-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongo: {condition: service_healthy}
    restart: "no"
    entrypoint: ["bash", "-c", "mongosh --host mongo:27017 --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }) }'"]

  redis:
    image: redis:7-alpine
    container_name: chabaqa-redis
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"}
    restart: unless-stopped
    volumes: [redis-data:/data]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    container_name: chabaqa-backend
    # Build in CI, not on this VPS. This local image is the last successful
    # production image and avoids the multi-gigabyte Next.js build spike.
    image: ${BACKEND_IMAGE:-chabaqa-chabaqa-backend:latest}
    command: ["node", "--max-old-space-size=768", "--max-semi-space-size=32", "dist/src/main.js"]
    env_file: [./backend/.env]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/chabaqa_local?replicaSet=rs0
      MONGODB_URI: mongodb://mongo:27017/chabaqa_local?replicaSet=rs0
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in root .env}"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SOCKET_IO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UV_THREADPOOL_SIZE: "8"
      MEDIA_STORAGE_DRIVER: disk
      MEDIA_STORAGE_READ_PREFERENCE: disk
      MEDIA_STORAGE_MIRROR_S3: "false"
      UPLOAD_MALWARE_SCANNING: disabled
      # Clear legacy env-file values for services that are intentionally absent.
      MEILI_HOST: ""
      MEILI_API_KEY: ""
      TYPESENSE_HOST: ""
      TYPESENSE_API_KEY: ""
      WHATSAPP_ENABLED: "false"
      ENABLE_SWAGGER: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-hls:/app/hls-output
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

  frontend:
    container_name: chabaqa-frontend
    image: ${FRONTEND_IMAGE:-chabaqa-chabaqa-frontend:latest}
    env_file: [./frontend/.env]
    environment:
      NODE_ENV: production
      # Next middleware verifies the same access-token signature as Nest. This
      # must be supplied at runtime; without it every protected navigation
      # returns to /signin even after a successful login.
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in root .env}"
      NODE_OPTIONS: --max-old-space-size=384 --max-semi-space-size=32
      API_INTERNAL_URL: http://backend:3000/api
    ports: ["127.0.0.1:8083:8083"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/api/health/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

volumes:
  mongo-data:
  redis-data:
  backend-hls:
