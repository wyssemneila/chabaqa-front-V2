services:
  mongo:
    image: mongo:7
    container_name: chabaqa-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chabaqa-redis
    command: redis-server --requirepass c25ec1b1cba859697df4d726baa3a30c7d0f21e0b1e5971f81fd99ebeb0a2fb9
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "c25ec1b1cba859697df4d726baa3a30c7d0f21e0b1e5971f81fd99ebeb0a2fb9", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: chabaqa-clamav
    user: "0:0"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3310"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  openwa-api:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: chabaqa-openwa
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      NODE_ENV: production
    volumes:
      - openwa-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  chabaqa-backend:
    container_name: chabaqa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/chabaqa_local
      MONGODB_URI: mongodb://mongo:27017/chabaqa_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENTS_STRIPE_DEFAULT: "true"
      STRIPE_ENABLED: "true"
      PAYMENTS_STRIPE_ENABLED: "true"
      PAYMENTS_STRIPE_COMMUNITY_ENABLED: "true"
      PAYMENTS_STRIPE_COURSE_ENABLED: "true"
      PAYMENTS_STRIPE_CHAPTER_ENABLED: "true"
      PAYMENTS_STRIPE_CHALLENGE_ENABLED: "true"
      PAYMENTS_STRIPE_EVENT_ENABLED: "true"
      PAYMENTS_STRIPE_PRODUCT_ENABLED: "true"
      PAYMENTS_STRIPE_SESSION_ENABLED: "true"
      PAYMENTS_ENABLE_WALLET_FALLBACK: "false"
      PAYMENTS_ENABLE_MANUAL_FALLBACK: "false"
      FLOUCI_ENABLED: "false"
      PAYMENTS_FLOUCI_ENABLED: "false"
      FLOUCI_APP_TOKEN: ""
      FLOUCI_APP_SECRET: ""
      FLOUCI_WEBHOOK_SECRET: ""
      KONNECT_ENABLED: "false"
      PAYMENTS_KONNECT_ENABLED: "false"
      KONNECT_MOCK_MODE: "false"
      KONNECT_API_KEY: ""
      KONNECT_WALLET_ID: ""
      UPLOAD_MALWARE_SCANNING: required
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      ADMIN_ALLOW_PASSWORD_ONLY_LOGIN: "false"
      ALLOW_ADMIN_DB_CLEANUP: "false"
      ENABLE_SWAGGER: "false"
      WHATSAPP_ENABLED: "false"
      OPENWA_BASE_URL: http://openwa-api:2785/api
      OPENWA_API_KEY: ""
      OPENWA_WEBHOOK_SECRET: ""
      WHATSAPP_DAILY_SESSION_SEND_LIMIT: "200"
      WHATSAPP_SEND_INTERVAL_MS: "1500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-hls:/app/hls-output
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      openwa-api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  chabaqa-frontend:
    container_name: chabaqa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        NEXT_PUBLIC_APP_URL: http://localhost:8083
        API_INTERNAL_URL: http://chabaqa-backend:3000/api
    ports:
      - "127.0.0.1:8083:8083"
    env_file:
      - ./frontend/.env
    environment:
      API_INTERNAL_URL: http://chabaqa-backend:3000/api
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_URL: http://localhost:8083
    depends_on:
      chabaqa-backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.next/cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  backend-hls:
    name: chabaqa_backend-hls
  mongo-data:
    name: chabaqa_mongo-data
  redis-data:
    name: chabaqa_redis-data
  clamav-data:
    name: chabaqa_clamav-data
  openwa-data:
    name: chabaqa_openwa-data
  demo-backend-hls:
    name: chabaqa_demo-backend-hls

networks:
  default:
    name: chabaqa-network
