services:
    mongo:
        image: mongo:7
        container_name: chabaqa-mongo
        command: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongo-data:/data/db
        restart: unless-stopped
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 1G
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    # One-shot: initiates the single-node replica set (rs0) so Mongoose
    # transactions work locally exactly like production. Safe to re-run.
    mongo-init:
        image: mongo:7
        container_name: chabaqa-mongo-init
        depends_on:
            mongo:
                condition: service_healthy
        entrypoint: >
            bash -c "
            mongosh --host mongo:27017 --quiet --eval '
              try {
                rs.status();
                print(\"replica set already initiated\");
              } catch (e) {
                rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
                print(\"replica set initiated\");
              }
            '
            "
        restart: "no"

    redis:
        image: redis:7-alpine
        container_name: chabaqa-redis
        command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in backend/.env}
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data
        restart: unless-stopped
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 256M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    clamav:
        image: clamav/clamav:stable
        container_name: chabaqa-clamav
        user: "0:0"
        ports:
            - "127.0.0.1:3310:3310"
        volumes:
            - clamav-data:/var/lib/clamav
        restart: unless-stopped
        tmpfs:
            - /tmp:noexec,nosuid,size=128m
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1G
        healthcheck:
            test: ["CMD-SHELL", "nc -z 127.0.0.1 3310"]
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 300s

    minio:
        image: minio/minio:latest
        container_name: chabaqa-minio
        command: server /data --console-address ":9001"
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in backend/.env}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in backend/.env}
            MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://chabaqa.io/monitoring/storage/}
            MINIO_PROMETHEUS_AUTH_TYPE: public
        volumes:
            - minio-data:/data
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    minio-init:
        image: minio/mc:latest
        container_name: chabaqa-minio-init
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in backend/.env}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in backend/.env}
            S3_BUCKET: ${S3_BUCKET:-chabaqa-media}
        entrypoint: >
            /bin/sh -c "
            mc alias set chabaqa http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
            mc mb --ignore-existing chabaqa/$$S3_BUCKET &&
            mc version enable chabaqa/$$S3_BUCKET
            "
        restart: "no"

    openwa-api:
        profiles:
            - whatsapp
        image: ghcr.io/rmyndharis/openwa:latest
        container_name: chabaqa-openwa
        ports:
            - "127.0.0.1:2785:2785"
        environment:
            NODE_ENV: production
            OPENWA_API_KEY: ${OPENWA_API_KEY:-}
            API_MASTER_KEY: ${OPENWA_API_KEY:-}
        volumes:
            - openwa-data:/app/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://127.0.0.1:2785/api/health/ready >/dev/null || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 768M

    meilisearch:
        image: getmeili/meilisearch:v1.12
        container_name: chabaqa-meilisearch
        ports:
            - "127.0.0.1:7700:7700"
        environment:
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in root .env}
            MEILI_ENV: production
        volumes:
            - meili-data:/meili_data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    chabaqa-backend:
        container_name: chabaqa-backend
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        ports:
            - "127.0.0.1:3000:3000"
        env_file:
            - ./backend/.env
        environment:
            HOST: 0.0.0.0
            PORT: 3000
            MONGO_URI: mongodb://mongo:27017/chabaqa_local?replicaSet=rs0
            MONGODB_URI: mongodb://mongo:27017/chabaqa_local?replicaSet=rs0
            REDIS_ENABLED: "true"
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in backend/.env}
            REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
            SOCKET_IO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
            MEILI_HOST: http://meilisearch:7700
            MEILI_API_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in root .env}
            MEILI_GLOBAL_INDEX: ${MEILI_GLOBAL_INDEX:-chabaqa_content}
            PAYMENTS_STRIPE_DEFAULT: "true"
            STRIPE_ENABLED: "true"
            PAYMENTS_STRIPE_ENABLED: "true"
            PAYMENTS_STRIPE_COMMUNITY_ENABLED: "true"
            PAYMENTS_STRIPE_COURSE_ENABLED: "true"
            PAYMENTS_STRIPE_CHAPTER_ENABLED: "true"
            PAYMENTS_STRIPE_CHALLENGE_ENABLED: "true"
            PAYMENTS_STRIPE_EVENT_ENABLED: "true"
            PAYMENTS_STRIPE_PRODUCT_ENABLED: "true"
            PAYMENTS_STRIPE_SESSION_ENABLED: "true"
            PAYMENTS_ENABLE_WALLET_FALLBACK: "false"
            UPLOAD_MALWARE_SCANNING: required
            CLAMAV_HOST: clamav
            CLAMAV_PORT: 3310
            ADMIN_ALLOW_PASSWORD_ONLY_LOGIN: "false"
            ALLOW_ADMIN_DB_CLEANUP: "false"
            ENABLE_SWAGGER: "false"
            WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
            OPENWA_BASE_URL: http://openwa-api:2785/api
            OPENWA_API_KEY: ${OPENWA_API_KEY:-}
            OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
            OPENWA_WEBHOOK_URL: ${OPENWA_WEBHOOK_URL:-http://chabaqa-backend:3000/api/whatsapp/openwa/webhook}
            WHATSAPP_DAILY_SESSION_SEND_LIMIT: ${WHATSAPP_DAILY_SESSION_SEND_LIMIT:-200}
            WHATSAPP_SEND_INTERVAL_MS: ${WHATSAPP_SEND_INTERVAL_MS:-1500}
            WHATSAPP_APPEND_OPT_OUT_FOOTER: ${WHATSAPP_APPEND_OPT_OUT_FOOTER:-true}
            MEDIA_STORAGE_DRIVER: s3
            MEDIA_STORAGE_READ_PREFERENCE: s3
            MEDIA_STORAGE_MIRROR_S3: "true"
            MEDIA_STORAGE_REQUIRE_S3: "false"
            MEDIA_PRESIGNED_ENABLED: "false"
            S3_ENDPOINT: http://minio:9000
            S3_REGION: ${S3_REGION:-us-east-1}
            S3_BUCKET: ${S3_BUCKET:-chabaqa-media}
            S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in backend/.env}
            S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in backend/.env}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./backend/uploads:/app/uploads
            - backend-hls:/app/hls-output
        depends_on:
            mongo:
                condition: service_healthy
            mongo-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            clamav:
                condition: service_started
            minio:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 512M
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://127.0.0.1:3000/api/health/ping",
                ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 60s
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"

    chabaqa-frontend:
        container_name: chabaqa-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile.prod
            args:
                NEXT_PUBLIC_API_URL: https://chabaqa.io/api
                NEXT_PUBLIC_APP_URL: https://chabaqa.io
                API_INTERNAL_URL: http://chabaqa-backend:3000/api
                NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
                SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        ports:
            - "127.0.0.1:8083:8083"
        env_file:
            - ./frontend/.env
        environment:
            API_INTERNAL_URL: http://chabaqa-backend:3000/api
            NEXT_PUBLIC_API_URL: https://chabaqa.io/api
            NEXT_PUBLIC_APP_URL: https://chabaqa.io
            SENTRY_DSN: ${SENTRY_DSN:-}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        depends_on:
            chabaqa-backend:
                condition: service_healthy
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /tmp:noexec,nosuid,size=64m
            - /app/.next/cache:noexec,nosuid,size=128m
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
            - NET_BIND_SERVICE
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 512M
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/api/health/ping"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"

    prometheus:
        image: prom/prometheus:latest
        container_name: chabaqa-prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
            - --web.external-url=https://chabaqa.io/monitoring/prometheus/
            - --web.route-prefix=/
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
            - prometheus-data:/prometheus
        depends_on:
            chabaqa-backend:
                condition: service_healthy
            chabaqa-frontend:
                condition: service_healthy
            blackbox-exporter:
                condition: service_started
            minio:
                condition: service_healthy
            alertmanager:
                condition: service_started
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

    alertmanager:
        image: prom/alertmanager:latest
        container_name: chabaqa-alertmanager
        env_file:
            - ./.env
        entrypoint:
            - /bin/sh
            - -c
            - |
              export PAGERDUTY_ROUTING_KEY="$${PAGERDUTY_ROUTING_KEY:-}"
              export PAGERDUTY_EVENTS_URL="$${PAGERDUTY_EVENTS_URL:-https://events.eu.pagerduty.com/v2/enqueue}"
              envsubst '$$PAGERDUTY_ROUTING_KEY $$PAGERDUTY_EVENTS_URL' \
                < /etc/alertmanager/config.template.yml > /tmp/alertmanager.yml
              exec /bin/alertmanager \
                --config.file=/tmp/alertmanager.yml \
                --storage.path=/alertmanager \
                --web.external-url=$${ALERTMANAGER_EXTERNAL_URL:-https://chabaqa.io/monitoring/alertmanager/}
        ports:
            - "127.0.0.1:9093:9093"
        volumes:
            - ./monitoring/alertmanager/config.template.yml:/etc/alertmanager/config.template.yml:ro
            - alertmanager-data:/alertmanager
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

    blackbox-exporter:
        image: prom/blackbox-exporter:latest
        container_name: chabaqa-blackbox-exporter
        command:
            - --config.file=/etc/blackbox_exporter/config.yml
        ports:
            - "127.0.0.1:9115:9115"
        volumes:
            - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

    grafana:
        image: grafana/grafana-oss:latest
        container_name: chabaqa-grafana
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in backend/.env}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://chabaqa.io/monitoring/grafana/}
            GF_SERVER_SERVE_FROM_SUB_PATH: "true"
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/chabaqa-production-overview.json
        volumes:
            - grafana-data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
        depends_on:
            prometheus:
                condition: service_started
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

    node-exporter:
        image: prom/node-exporter:latest
        container_name: chabaqa-node-exporter
        command:
            - --path.rootfs=/host
        pid: host
        ports:
            - "127.0.0.1:9100:9100"
        volumes:
            - /:/host:ro,rslave
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 128M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: chabaqa-cadvisor
        privileged: true
        devices:
            - /dev/kmsg:/dev/kmsg
        ports:
            - "127.0.0.1:8088:8080"
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "3"

volumes:
    backend-hls:
        name: chabaqa_backend-hls
    mongo-data:
        name: chabaqa_mongo-data
    redis-data:
        name: chabaqa_redis-data
    clamav-data:
        name: chabaqa_clamav-data
    openwa-data:
        name: chabaqa_openwa-data
    minio-data:
        name: chabaqa_minio-data
    demo-backend-hls:
        name: chabaqa_demo-backend-hls
    prometheus-data:
        name: chabaqa_prometheus-data
    grafana-data:
        name: chabaqa_grafana-data
    alertmanager-data:
        name: chabaqa_alertmanager-data
    meili-data:
        name: chabaqa_meili-data

networks:
    default:
        name: chabaqa-network
