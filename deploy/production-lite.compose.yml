# Production topology for Dokploy (or `docker compose`).
# It deliberately contains no MongoDB, MinIO, Meilisearch, ClamAV, or full
# Prometheus stack. Those services are either managed externally or optional,
# keeping the VPS predictable under load.
#
# Dokploy: create a Docker Compose application using this file and set every
# variable from deploy/production-lite.env.example in its encrypted environment.
name: chabaqa

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable registry image tag}
    # Override the image's conservative default with a value still below the
    # cgroup limit; this prevents V8 from triggering host-wide OOM pressure.
    command: ["node", "--max-old-space-size=768", "--max-semi-space-size=32", "dist/src/main.js"]
    env_file:
      - path: ./backend.production.env
        required: false
    restart: unless-stopped
    init: true
    expose: ["3000"]
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [private]

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable registry image tag}
    env_file:
      - path: ./frontend.production.env
        required: false
    environment:
      NODE_OPTIONS: --max-old-space-size=384 --max-semi-space-size=32
      API_INTERNAL_URL: http://backend:3000/api
    restart: unless-stopped
    init: true
    expose: ["8083"]
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/api/health/ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 64
    volumes: [redis-data:/data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [private]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    pids_limit: 128
    volumes: [uptime-kuma-data:/app/data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [private]

networks:
  private:
    internal: true

volumes:
  redis-data:
  uptime-kuma-data:
