name: CI/CD Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ── Stage 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck || true

  # ── Stage 2: Build ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      API_INTERNAL_URL: ${{ secrets.API_INTERNAL_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  # ── Stage 3: Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --passWithNoTests || true

  # ── Stage 4: Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/chabaqa/frontend
            
            echo "📦 Pulling latest frontend code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔨 Rebuilding frontend container..."
            cd /home/ubuntu/chabaqa
            sudo docker compose build --no-cache chabaqa-frontend
            
            echo "♻️ Restarting frontend..."
            sudo docker compose up -d --force-recreate --no-deps chabaqa-frontend
            
            echo "⏳ Waiting for frontend health..."
            sleep 10
            
            HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' chabaqa-frontend 2>/dev/null || echo "unknown")
            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Frontend deployed successfully!"
            else
              echo "⚠️ Health: $HEALTH — checking..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/)
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ]; then
                echo "✅ Frontend responding ($STATUS) — deploy OK"
              else
                echo "❌ Frontend not responding ($STATUS)"
                sudo docker logs chabaqa-frontend --tail 20
                exit 1
              fi
            fi
            
            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f
