# Optional local overrides — copy to docker-compose.override.yml (gitignored).
# Use when you want to run backend/frontend on the host instead of in Docker,
# or to tweak ports without editing the main compose file.
#
# Example: infra only (backend + frontend run via npm on the host):
#   docker compose up -d mongo mongo-init redis minio minio-init clamav
#
# Example: disable monitoring locally to save RAM:
#   docker compose up -d mongo mongo-init redis minio minio-init clamav chabaqa-backend chabaqa-frontend

services:
  chabaqa-backend:
    profiles: ["full-stack"]

  chabaqa-frontend:
    profiles: ["full-stack"]

  prometheus:
    profiles: ["monitoring"]

  grafana:
    profiles: ["monitoring"]

  alertmanager:
    profiles: ["monitoring"]

  node-exporter:
    profiles: ["monitoring"]

  cadvisor:
    profiles: ["monitoring"]

  blackbox-exporter:
    profiles: ["monitoring"]
