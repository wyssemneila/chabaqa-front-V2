version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      # Monthly (was weekly) to cut the number of PR waves that each trigger a
      # full CI run. Security-critical bumps still surface via the audit gates.
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      backend-security-and-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
    open-pull-requests-limit: 3
    groups:
      frontend-security-and-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 3
