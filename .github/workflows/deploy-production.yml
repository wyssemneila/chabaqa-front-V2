name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment scripts
        run: bash -n deploy.sh deploy-pm2.sh scripts/verify-production.sh scripts/smoke-production.sh scripts/backup-mongo.sh scripts/restore-mongo-backup.sh

      - name: Validate compose file
        run: |
          # Compose interpolation happens before service env_file files are read.
          # Supply inert values only for the required variables so this check
          # validates the production topology without accessing production secrets.
          printf '%s\n' \
            'REDIS_PASSWORD=validation-only-redis-password' \
            'MINIO_ROOT_USER=validation-only-minio-user' \
            'MINIO_ROOT_PASSWORD=validation-only-minio-password' \
            'MEILI_MASTER_KEY=validation-only-meili-master-key' \
            'GRAFANA_ADMIN_PASSWORD=validation-only-grafana-password' > .env
          touch frontend/.env
          touch backend/.env
          docker compose config --quiet

  deploy:
    name: Docker Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify CI passed
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "CI workflow did not succeed (conclusion=${CONCLUSION}). Deploy cancelled."
            exit 1
          fi
          echo "CI check passed (conclusion=${CONCLUSION})"

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || (echo "Missing VPS_HOST secret" && exit 1)
          test -n "$VPS_USER" || (echo "Missing VPS_USER secret" && exit 1)
          test -n "$VPS_PASSWORD" || (echo "Missing VPS_PASSWORD secret" && exit 1)
          test -n "$VPS_PORT" || (echo "Missing VPS_PORT secret" && exit 1)
          echo "Deployment secrets are present. Using password SSH on port ${VPS_PORT}."

      - name: Run remote deployment with password SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          timeout: 30m
          command_timeout: 45m
          script: |
            set -euo pipefail
            export PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/home/ubuntu/chabaqa"
            fi
            export BRANCH="main"
            export GIT_REPO="${{ github.repository }}"
            export GIT_AUTH_USER="x-access-token"
            export GIT_AUTH_TOKEN="${{ github.token }}"

            echo "[github-actions] connected to $(hostname) as $(whoami)"
            echo "[github-actions] docker deploying ${GIT_REPO}:${BRANCH} into ${PROJECT_DIR}"

            cd "$PROJECT_DIR"
            chmod +x ./deploy.sh
            ./deploy.sh
