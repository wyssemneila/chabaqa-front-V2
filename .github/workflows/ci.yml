name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Docs-only changes don't affect the build/tests or the deploy, so skip the
    # whole pipeline (and the deploy it gates) for them.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: i18n parity
        run: npm run i18n:check:parity

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://chabaqa.io/api
          NEXT_PUBLIC_APP_URL: https://chabaqa.io
          API_INTERNAL_URL: http://127.0.0.1:3000/api
        run: npm run build

  backend:
    name: Backend - Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: E2E tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          PORT: 3000
          HOST: 127.0.0.1
          MONGO_URI: mongodb://127.0.0.1:27017/chabaqa_test
          MONGODB_URI: mongodb://127.0.0.1:27017/chabaqa_test
          JWT_SECRET: ci-jwt-secret-that-is-long-enough
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough
          GOOGLE_AUTH_CLIENT_ID: ci-google-client-id
          GOOGLE_AUTH_CLIENT_SECRET: ci-google-client-secret
          STRIPE_SECRET_KEY: ci-stripe-secret-key
          STRIPE_WEBHOOK_SECRET: ci-stripe-webhook-secret
          OPENROUTER_API_KEY: ci-openrouter-api-key
          REDIS_ENABLED: false
          FRONTEND_URL: http://localhost:8083
          SERVER_URL: http://localhost:3000/api
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend - Playwright E2E
    runs-on: ubuntu-latest
    # Dependency bumps are validated by lint/unit/build on the frontend and
    # backend jobs; the full browser E2E run is the most expensive job, so skip
    # it for Dependabot PRs to stay under the Actions minutes budget.
    if: github.actor != 'dependabot[bot]'
    # Without this the job inherits GitHub's 6-hour default, so a wedged E2E run
    # burns Actions minutes silently instead of failing fast.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        # On a cache hit only pull the OS deps; the browser binaries are restored
        # from cache, saving the multi-minute download each run.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start backend
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          HOST: 127.0.0.1
          MONGO_URI: mongodb://127.0.0.1:27017/chabaqa_e2e
          MONGODB_URI: mongodb://127.0.0.1:27017/chabaqa_e2e
          JWT_SECRET: ci-jwt-secret-that-is-long-enough
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough
          GOOGLE_AUTH_CLIENT_ID: ci-google-client-id
          GOOGLE_AUTH_CLIENT_SECRET: ci-google-client-secret
          STRIPE_SECRET_KEY: ci-stripe-secret-key
          STRIPE_WEBHOOK_SECRET: ci-stripe-webhook-secret
          OPENROUTER_API_KEY: ci-openrouter-api-key
          REDIS_ENABLED: false
          FRONTEND_URL: http://localhost:8083
          SERVER_URL: http://localhost:3000/api
        run: |
          npm run start:dev &
          npx wait-on http://127.0.0.1:3000/api/health/ping -t 180000

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:8083
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
          API_INTERNAL_URL: http://localhost:3000/api
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        # Only keep the report when the run fails — a green run's report is never
        # looked at and just consumes Actions storage.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3

  docker-validate:
    name: Docker Deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployment scripts/compose don't change on a dependency bump, so skip this
    # for Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment scripts
        run: bash -n deploy.sh deploy-pm2.sh scripts/verify-production.sh scripts/smoke-production.sh scripts/backup-mongo.sh scripts/restore-mongo-backup.sh scripts/backup-mongo.sh scripts/restore-mongo-backup.sh

      - name: Create CI env placeholders
        run: |
          touch frontend/.env
          touch backend/.env
          # Root .env is both an env_file for the compose stack and the source
          # Compose interpolates ${VAR:?...} from, so the required vars live here.
          cat > .env <<'EOF'
          MINIO_ROOT_USER=ci-placeholder
          MINIO_ROOT_PASSWORD=ci-placeholder
          REDIS_PASSWORD=ci-placeholder
          MEILI_MASTER_KEY=ci-placeholder
          GRAFANA_ADMIN_PASSWORD=ci-placeholder
          EOF

      - name: Validate compose file
        run: docker compose config --quiet
