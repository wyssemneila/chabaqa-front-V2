name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: https://chabaqa.io/api
          NEXT_PUBLIC_APP_URL: https://chabaqa.io
          API_INTERNAL_URL: http://127.0.0.1:3000/api
        run: npm run build

  backend:
    name: Backend - Lint, Test, Build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: E2E tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          PORT: 3000
          HOST: 127.0.0.1
          MONGO_URI: mongodb://127.0.0.1:27017/chabaqa_test
          MONGODB_URI: mongodb://127.0.0.1:27017/chabaqa_test
          JWT_SECRET: ci-jwt-secret-that-is-long-enough
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough
          REDIS_ENABLED: false
          FRONTEND_URL: http://localhost:8083
          SERVER_URL: http://localhost:3000/api
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker-validate:
    name: Docker Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: bash -n deploy.sh deploy-pm2.sh scripts/verify-production.sh scripts/smoke-production.sh

      - name: Create CI env placeholders
        run: |
          touch frontend/.env
          touch backend/.env

      - name: Validate compose file
        run: docker compose config --quiet
