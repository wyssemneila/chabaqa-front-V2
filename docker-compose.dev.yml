# Dev mode overrides: runs backend + frontend with hot-reload (HMR).
# Changes to source code on the host are reflected immediately inside containers.
#
# Apply with: docker compose -f docker-compose.yml -f docker-compose.local-prod.yml -f docker-compose.dev.yml up -d

services:
  chabaqa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chabaqa-backend-dev
    volumes:
      # Keep dependencies in a named volume. Source is copied into the dev image;
      # mounting the full backend tree on Docker Desktop for Windows can stall
      # Nest's initial TypeScript compilation on the 9P filesystem bridge.
      - backend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=1024
      # Browser-facing URLs must use the HTTPS reverse proxy, not the host-only
      # Docker ports. This keeps generated media URLs free of mixed content.
      SERVER_URL: https://chabaqa.io/api
      FRONTEND_URL: https://chabaqa.io
      NEXT_PUBLIC_APP_URL: https://chabaqa.io
      CORS_ORIGIN: https://chabaqa.io
      CORS_ALLOWED_ORIGINS: https://chabaqa.io
      MEDIA_PUBLIC_BASE_URL: https://chabaqa.io
    command: ["npm", "run", "start:dev"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health/ping"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    read_only: false
    cap_drop: []
    cap_add: []

  chabaqa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chabaqa-frontend-dev
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/hooks:/app/hooks
      - ./frontend/lib:/app/lib
      - ./frontend/types:/app/types
      - ./frontend/i18n:/app/i18n
      - ./frontend/messages:/app/messages
      - ./frontend/middleware:/app/middleware
      - ./frontend/public:/app/public
      - ./frontend/scripts:/app/scripts
      - ./frontend/package.json:/app/package.json
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - frontend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      # Needed only for the temporary recovery server: Next's automatic heap
      # sizing is too low under a cgroup limit and causes a restart loop.
      NODE_OPTIONS: --max-old-space-size=1024 --max-semi-space-size=32
      PORT: 8083
      HOSTNAME: 0.0.0.0
      # Keep browser traffic on the public domain while this container serves
      # chabaqa.io through Nginx. This avoids localhost-only API/socket URLs.
      NEXT_PUBLIC_API_URL: https://chabaqa.io/api
      NEXT_PUBLIC_APP_URL: https://chabaqa.io
      NEXT_PUBLIC_SOCKET_URL: https://chabaqa.io
      API_INTERNAL_URL: http://chabaqa-backend:3000/api
    command: ["npm", "run", "dev"]
    depends_on:
      chabaqa-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/api/health/ping"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop: []
    cap_add: []

volumes:
  backend-node-modules:
  frontend-node-modules:
