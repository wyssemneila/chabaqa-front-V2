proxy_cache_path /var/cache/nginx/chabaqa-frontend levels=1:2 keys_zone=chabaqa_frontend_cache:50m max_size=1g inactive=60m use_temp_path=off;

map $request_method $chabaqa_skip_cache_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $http_authorization $chabaqa_skip_cache_auth {
    default 1;
    "" 0;
}

map $http_cookie $chabaqa_skip_cache_cookie {
    default 0;
    ~*(accessToken|access_token|refreshToken|refresh_token|token=|admin) 1;
}

map $http_rsc $chabaqa_skip_cache_rsc {
    default 1;
    "" 0;
}

map $http_next_router_prefetch $chabaqa_skip_cache_prefetch {
    default 1;
    "" 0;
}

map $http_next_router_state_tree $chabaqa_skip_cache_router_state {
    default 1;
    "" 0;
}

map $request_uri $chabaqa_public_landing_cacheable {
    default 0;
    ~^/(en|ar)/?(\?.*)?$ 1;
    ~^/(?:(en|ar)/)?(pricing|faq|privacy-policy|terms-of-service)/?(\?.*)?$ 1;
    ~^/(?:(en|ar)/)?blogs(/.*)?(\?.*)?$ 1;
}

map $chabaqa_public_landing_cacheable $chabaqa_skip_cache_non_public {
    default 1;
    1 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name chabaqa.io www.chabaqa.io;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chabaqa.io www.chabaqa.io;

    ssl_certificate /etc/letsencrypt/live/chabaqa.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chabaqa.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location = /monitoring {
        return 301 /monitoring/grafana/;
    }

    location = /monitoring/grafana {
        return 301 /monitoring/grafana/;
    }

    location = /monitoring/prometheus {
        return 301 /monitoring/prometheus/;
    }

    location = /monitoring/storage {
        return 301 /monitoring/storage/;
    }

    location = /monitoring/cadvisor {
        return 301 /monitoring/cadvisor/;
    }

    location = /monitoring/blackbox {
        return 301 /monitoring/blackbox/;
    }

    location /monitoring/grafana/ {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /monitoring/grafana;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /monitoring/prometheus/ {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /monitoring/storage/ {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /monitoring/storage;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /monitoring/cadvisor/ {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:8088/;
        proxy_redirect ~^(/.*)$ /monitoring/cadvisor$1;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/monitoring/cadvisor/';
        sub_filter 'src="/' 'src="/monitoring/cadvisor/';
        sub_filter 'action="/' 'action="/monitoring/cadvisor/';
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /monitoring/blackbox/ {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:9115/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /monitoring/node/metrics {
        auth_basic "Chabaqa monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

        proxy_pass http://127.0.0.1:9100/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~ ^/(?:en|ar)/?$|^/(?:(?:en|ar)/)?(?:pricing|faq|privacy-policy|terms-of-service)/?$|^/(?:(?:en|ar)/)?blogs(?:/.*)?$ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_cache chabaqa_frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_bypass $chabaqa_skip_cache_method $chabaqa_skip_cache_auth $chabaqa_skip_cache_cookie $chabaqa_skip_cache_rsc $chabaqa_skip_cache_prefetch $chabaqa_skip_cache_router_state;
        proxy_no_cache $chabaqa_skip_cache_method $chabaqa_skip_cache_auth $chabaqa_skip_cache_cookie $chabaqa_skip_cache_rsc $chabaqa_skip_cache_prefetch $chabaqa_skip_cache_router_state;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=600" always;
        add_header X-Chabaqa-Cache $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host chabaqa.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

    }
}
