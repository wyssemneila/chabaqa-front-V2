groups:
  - name: chabaqa-availability
    rules:
      - alert: BackendDown
        expr: up{job="chabaqa-backend-metrics"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Chabaqa backend is down'
          description: 'Prometheus has failed to scrape chabaqa-backend-metrics for 2+ minutes. See docs/runbooks/backend-down.md.'

      - alert: HttpProbeFailing
        expr: probe_success{job="chabaqa-http-probes"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'HTTP probe failing for {{ $labels.instance }}'
          description: 'Blackbox exporter probe has failed for 3+ minutes on {{ $labels.instance }}.'

      - alert: MinioDown
        expr: up{job=~"minio.*"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'MinIO metrics endpoint unreachable'
          description: 'Object storage metrics scrape has failed for 5+ minutes.'

  - name: chabaqa-resources
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU load on {{ $labels.instance }}'
          description: 'CPU usage above 90% for 10+ minutes.'

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Low available memory on {{ $labels.instance }}'
          description: 'Available memory below 10% for 10+ minutes.'

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Low disk space on {{ $labels.instance }}'
          description: 'Root filesystem below 10% free space for 10+ minutes.'

      - alert: CacheHitRateLow
        expr: |
          (
            rate(shabaka_cache_hits_total[15m])
            /
            (rate(shabaka_cache_hits_total[15m]) + rate(shabaka_cache_misses_total[15m]))
          ) < 0.5
          and (rate(shabaka_cache_hits_total[15m]) + rate(shabaka_cache_misses_total[15m])) > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Redis cache hit rate below 50%'
          description: 'Cache hit ratio dropped below 50% over 15 minutes. Review cache keys and TTLs — see docs/runbooks/scaling.md.'

      - alert: ContainerRestartingFrequently
        expr: increase(container_last_seen[10m]) > 0 and rate(container_cpu_usage_seconds_total{name=~"chabaqa-.*"}[10m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Container churn detected for {{ $labels.name }}'
          description: 'cAdvisor reports repeated container restarts/instability.'

      - alert: IntegrationDeliveryExhausted
        expr: shabaka_integration_delivery_exhausted > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Creator integration delivery exhausted retries'
          description: 'One or more provider or webhook deliveries exhausted all retries. Review the creator integrations delivery health panel.'

      - alert: IntegrationCredentialFailure
        expr: increase(shabaka_integration_credential_encryption_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Creator integration credential encryption failure'
          description: 'Credential encryption or decryption failed. Check INTEGRATIONS_ENCRYPTION_KEY before changing any provider configuration.'
